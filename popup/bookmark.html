<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Bookmark</title>
    <link rel="stylesheet" href="../css/links.css">
    <!--<link rel="stylesheet" href="../css/fontawesome.css">-->
    <link href="../lib/fontawesome/css/all.css" rel="stylesheet">
</head>

<body class="m-0 bookmark">
    <div class="panel m-0">
        <div class="panel-header row">
            <div class="column-80">
                <h1 class="my-1">Bookmark This Page!</h1>
            </div>
            <div class="column-20 text-right">
                <button id="copy_bookmark" class="p-1 icon-btn" title="Copy to Clipboard"><i class="fa fa-clipboard"></i></button>
                <button id="logout" class="p-1 icon-btn" title="Logout"><i class="fa fa-sign-out fa-xs"></i></button>
            </div>
        </div>

        <div class="panel-body">
        <div id="errors" class="word-break"></div>

        <div class="search-panel" id="display_search">
            <div class="search-panel-header"><i class="fa fa-search"></i> Quick Search</div>
            <div class="row">
                <div class="column-100 search-wrap">
                    <input type="text" id="quick_search" class="m-0 p-2 bookmark" placeholder="Search your buckets &amp; links..." autocomplete="off" autofocus>
                    <div id="search_results" class="search-results"></div>
                </div>
            </div>
        </div>

        <div class="row my-3 divider">
            <div class="column-100"><span>Add New Bookmark</span></div>
        </div>

        <div class="row my-3" id="display_name">
            <div class="column-100">
                <input type="text" id="link_name" class="m-0 p-2 bookmark" value="Test"><br/>
                <small class="ml-2 strong">Name</small>
            </div>
        </div>

        <div class="row mt-3" id="display_description">
            <div class="column-100">
                <textarea id="link_description" name="description" rows="3"></textarea><br/>
                <small class="ml-2 strong">Notes</small>
            </div>
        </div>

        <div class="row mt-3" id="display_favorite">
            <div class="column-100 row-favorite">
                <small class="strong">Favorite</small>
                <label class="switch" title="Mark as Favorite">
                    <input type="checkbox" id="link_favorite">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="row mt-3" id="display_bucket">
            <div class="column-80">
                <select id="link_bucket" class="mr-2 p-1" name="bucket">
                    <option value="">-- Bucket --</option>
                </select>
            </div>
            <div class="column-20 text-right">
                <button id="add_bookmark" class="btn btn-info btn-sm"><!--<i class="fa fa-plus mr-1"> </i> -->Save</button>
            </div>
        </div>

        <div class="row mt-5" style="display: none;">
            <div class="column-100">
                <hr/>
                <input type="hidden" id="link_url" class="mt-2 word-break">
            </div>
        </div>
        </div>

    </div>


    <script src="../js/bookmark.js"></script>
</body>
</html>
